services:
  db:
    image: postgres:17
    container_name: recurflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recurflow}
      POSTGRES_USER: ${POSTGRES_USER:-recurflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - recurflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recurflow} -d ${POSTGRES_DB:-recurflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  recurflow_postgres_data:
    name: recurflow_postgres_data
