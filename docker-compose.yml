services:
  postgres:
    image: postgres:16-alpine
    container_name: recurflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: recurflow
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: recurflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recurflow -d recurflow"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    driver: local
